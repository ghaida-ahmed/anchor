# Render Blueprint for the ANCHOR API.
#
# Optional: everything here can be set by hand in Render's dashboard, and the
# step-by-step is in docs/deployment.md. Committing it means the service's shape
# is reviewable in the repository rather than living only in a web form.
#
# NO DATABASE IS DECLARED. The database is Supabase Postgres, created outside
# Render, and reached through DATABASE_URL. Declaring a Render database here would
# create a second one nobody uses.
#
# Every `sync: false` value must be entered in the Render dashboard. They are
# secrets or environment-specific, and none of them belongs in this file.

services:
  - type: web
    name: anchor-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/ready
    # The rate limiter holds its counters in process memory, so a second instance
    # would double the effective limits. See the README.
    numInstances: 1
    autoDeploy: true

    envVars:
      # --- application ---
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

      # --- secrets and environment-specific values: set in the dashboard ---
      # Supabase pooled connection string, with ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: SECRET_KEY
        sync: false
      # JSON array, e.g. ["https://anchor.vercel.app"]
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # --- private object storage ---
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      # Backend-only. Bypasses row-level security; never give this a VITE_ prefix.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: course-documents

      # --- pool sizing for a small managed Postgres ---
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
