name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first: CI feedback on a superseded
# commit is not worth a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — ruff, format, pytest
    runs-on: ubuntu-latest

    services:
      # The application depends on pgvector, and the tests exercise real vector
      # queries. A stock postgres image would fail on `CREATE EXTENSION vector`,
      # so CI runs the same image docker-compose uses locally.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: anchor
          POSTGRES_PASSWORD: anchor
          POSTGRES_DB: anchor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anchor -d anchor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+psycopg://anchor:anchor@localhost:5432/anchor_test
      DATABASE_URL: postgresql+psycopg://anchor:anchor@localhost:5432/anchor_test
      ENVIRONMENT: development
      # No provider key is set, and none is needed: the suite injects
      # FakeEmbeddingProvider and FakeLLMProvider through FastAPI's dependency
      # overrides, so CI never makes a paid API call. A real key in CI would buy
      # nothing and would be one more place for it to leak.

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app/

      - name: Format check (ruff)
        working-directory: backend
        run: ruff format --check app/

      - name: Enable pgvector
        run: |
          PGPASSWORD=anchor psql -h localhost -U anchor -d anchor_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Migrations apply from a clean database
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: No migration drift
        working-directory: backend
        # Fails if the models have changed without a matching migration.
        run: python -m alembic check

      - name: Tests
        working-directory: backend
        # conftest downgrades to base and re-upgrades per session, so this also
        # re-verifies the migrations are reversible.
        run: pytest -q

  frontend:
    name: Frontend — typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Production build
        working-directory: frontend
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0

      - name: Scan tracked files for credential patterns
        run: python3 scripts/scan_secrets.py
